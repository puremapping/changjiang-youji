<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同一条江，五个时代 — 时间谱系</title>
<!--
  图 A｜时间谱系（chart_a_timeline.html）
  规格来源：proto/CHART_SPEC.md。图型 / 结论标题 / 数据 / 数据源均由主会话给定，本文件只做视觉实现。

  设计决策记录（供后续修改者）：
  1. 年轴 773–1679 等距线性映射，不按人物重要性与作品密度扭曲间距。
  2. 34 条数据逐一内联：timeline.json 的 15 life + 17 work + 2 book。life 取 y=year；
     work/book 取 visit_year（即 JSON 中 year 字段）。张岱两篇 write 年为 null，不塞进轴，
     改以轴外注记说明「明亡后追忆」。
  3. 形状冗余编码：life=空心菱形 / work=实心圆 / book=实心方；颜色只是辅助，不靠颜色单独区分。
  4. 悬停用 SVG 原生 <title>（零 JS 依赖）；点击更新下方信息条（唯一 JS 逻辑）。
  5. 原文纪日与繁体书名照抄 timeline.json 的 text 字段，一字未改。
  6. 数据未经任何改动；如发现数字可疑，应回报主会话，不在本文件内修。

  HONESTY: 合计 34 条 = 17 work + 15 life + 2 book，与 timeline.json id tl-001…tl-034 一一对应。
-->
<style>
:root{
  --bg:#f4f1e8; --panel:#fbf9f2; --line:#d8d2c2; --line2:#e6e1d3;
  --ink:#33302a; --dim:#6d675c; --dim2:#98917f;
  --liu:#6a9455; --su:#8f6bb0; --lu:#b0741c; --fan:#2c7da0; --zhang:#b05a5a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;padding:26px 22px 34px}
.card{max-width:1240px;margin:0 auto}
header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
h1{font-size:27px;font-weight:600;letter-spacing:.14em;margin:0 0 8px;color:var(--ink)}
.sub{font-size:12.5px;color:var(--dim);letter-spacing:.05em}
.legend{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.legend .names{display:flex;gap:16px;flex-wrap:wrap}
.legend .names b{font-weight:400}
.block{background:var(--panel);border:1px solid var(--line);position:relative}
svg{display:block;width:100%;height:auto}
#info{margin-top:12px;border:1px solid var(--line);background:var(--panel);
  padding:11px 14px;min-height:44px;font-size:12.5px;line-height:1.7;color:var(--dim)}
#info b{color:var(--ink);font-weight:600}
.src{margin-top:14px;font-size:11px;color:var(--dim2);letter-spacing:.02em;text-align:right}
svg text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif}
svg .ax{font-size:11px;fill:#98917f}
svg .lbl{font-size:12px;fill:#5f594e}
svg .who{font-size:13px;font-weight:600}
svg .note{font-size:10.5px;fill:#8b8474}
svg .grid{stroke:#e4dfd0;stroke-width:1}
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>同一条江，五个时代</h1>
    <div class="sub">773–1679 · 五条生命线与 34 条作品 / 生平 / 书籍纪年 · 年轴等距，不按重要性扭曲</div>
  </header>

  <div class="legend">
    <span><i style="background:var(--liu);border-radius:50%"></i>柳宗元</span>
    <span><i style="background:var(--su);border-radius:50%"></i>苏轼</span>
    <span><i style="background:var(--lu);border-radius:50%"></i>陆游</span>
    <span><i style="background:var(--fan);border-radius:50%"></i>范成大</span>
    <span><i style="background:var(--zhang);border-radius:50%"></i>张岱</span>
    <span style="border-left:1px solid var(--line);padding-left:20px">
      <svg width="14" height="12" viewBox="0 0 14 12" style="vertical-align:-1px"><path d="M7 1 L12 6 L7 11 L2 6 Z" fill="none" stroke="#6d675c" stroke-width="1.4"/></svg>生平事件
      <svg width="14" height="12" viewBox="0 0 14 12" style="vertical-align:-1px;margin-left:10px"><circle cx="7" cy="6" r="4.5" fill="#6d675c"/></svg>作品（visit 年）
      <svg width="14" height="12" viewBox="0 0 14 12" style="vertical-align:-1px;margin-left:10px"><rect x="3" y="2" width="8" height="8" fill="#6d675c"/></svg>书籍行程年
    </span>
  </div>

  <div class="block"><svg id="chart" viewBox="0 0 1200 720" role="img" aria-label="773 至 1679 年五位作者生命线与作品年点"></svg></div>
  <div id="info">点击任一节点查看该条记录（悬停亦有原生提示）。</div>
  <div class="src">来源：data/base/timeline.json（34 条）+ works_v1 visit/write 字段｜审校 2026-11-22</div>
</div>

<script>
/* 数据：timeline.json 34 条，逐条照录 text 字段；type life/work/book，year 取记录 year。
   顺序按作者分组、组内按年份，便于核对；id 对应关系见文件末注释。 */
var DATA = [
 ["life","liu",773,"柳宗元生"],
 ["life","liu",805,"柳宗元和科进士及第"],
 ["life","liu",819,"柳宗元卒（柳州）"],
 ["life","su",1037,"苏轼生"],
 ["life","su",1057,"苏轼嘉祐二年进士及第"],
 ["life","su",1101,"苏轼卒"],
 ["life","lu",1125,"陆游生（山阴）"],
 ["life","lu",1166,"陆游乾道二年进士及第"],
 ["life","lu",1210,"陆游卒"],
 ["life","fan",1126,"范成生生（吴）"],
 ["life","fan",1150,"范成大绍圣元年进士及第"],
 ["life","fan",1193,"范成大卒"],
 ["life","zhang",1597,"张岱生（山阴）"],
 ["life","zhang",1644,"明亡（南京/杭州相继陷落）"],
 ["life","zhang",1679,"张岱卒"],
 ["work","liu",809,"《鈷鉧潭記》：游期 809  ；成文 809  （原文纪日 —）"],
 ["work","liu",809,"《鈷鉧潭西小丘記》：游期 809 10 6；成文 809 10 （原文纪日 得西山後八日）"],
 ["work","liu",809,"《始得西山宴遊記》：游期 809 9 28；成文 809 9 28（原文纪日 今年九月二十八日）"],
 ["work","liu",809,"《至小丘西小石潭記》：游期 809 10 ；成文 809 10 （原文纪日 —）"],
 ["work","liu",812,"《石澗記》：游期 812 10 ；成文 812 10 （原文纪日 —）"],
 ["work","liu",812,"《石渠記》：游期 812  ；成文 812 10 （原文纪日 元和七年正月八日，蠲渠至大石。十月十九日，逾石得石泓小潭）"],
 ["work","liu",812,"《小石城山記》：游期 812 10 ；成文 812 10 （原文纪日 —）"],
 ["work","liu",812,"《袁家渴記》：游期 812 10 ；成文 812 10 （原文纪日 —）"],
 ["work","liu",813,"《遊黃溪記》：游期 813  ；成文 813 5 16（原文纪日 元和八年五月十六日）"],
 ["work","su",1071,"《遊金山寺》：游期 1071 11 ；成文 1071  （原文纪日 —）"],
 ["work","su",1082,"《赤壁賦》：游期 1082 7 15；成文 1082  （原文纪日 壬戌之秋，七月既望）"],
 ["work","su",1082,"《後赤壁賦》：游期 1082 10 15；成文 1082  （原文纪日 是歲十月之望）"],
 ["work","su",1084,"《石鐘山記》：游期 1084 6 ；成文 1084  （原文纪日 元豐七年六月丁丑）"],
 ["work","lu",1170,"《入蜀記》：游期 1170 5 18；成文 1170 5 18（原文纪日 乾道六年閏五月十八日）"],
 ["work","fan",1177,"《吳船錄》：游期 1177 5 29；成文 1177 5 29（原文纪日 淳熙丁酉歲五月二十九日）"],
 ["work","zhang",1629,"《金山夜戲》：游期 1629 8 16；成文 明亡後追憶  （原文纪日 崇禎二年中秋後一日）"],
 ["work","zhang",1642,"《金山競渡》：游期 1642  ；成文 明亡後追憶  （原文纪日 —）"],
 ["book","lu",1170,"《入蜀記》行程自「乾道五年十二月六日」至「十月二十七日」（卷 1/6），逐日 156 条见 events 表；总日历天数未核算（农历大小月未查历表，按纪律不推算）"],
 ["book","fan",1177,"《吳船錄》行程自「淳熙丁酉歲五月二十九日戊辰」至「十月己巳」（卷 1/2），逐日 110 条见 events 表；总日历天数未核算（农历大小月未查历表，按纪律不推算）"]
];
/* 对应 timeline.json：life = tl-020…034（15）；work = tl-003…019（17）；
   book = tl-001 / tl-002（2）。合计 34。 */

var AUTH = {
  liu:   {name:"柳宗元", c:"#6a9455", birth:773,  death:819},
  su:    {name:"苏轼",   c:"#8f6bb0", birth:1037, death:1101},
  lu:    {name:"陆游",   c:"#b0741c", birth:1125, death:1210},
  fan:   {name:"范成大", c:"#2c7da0", birth:1126, death:1193},
  zhang: {name:"张岱",   c:"#b05a5a", birth:1597, death:1679}
};
var ORDER = ["liu","su","lu","fan","zhang"];
var NS = "http://www.w3.org/2000/svg";
function E(t,a,p){var n=document.createElementNS(NS,t);if(a)for(var k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n;}
function T(p,x,y,s,cls,anchor){var n=E("text",{x:x,y:y,"class":cls||"lbl"},p);if(anchor)n.setAttribute("text-anchor",anchor);n.textContent=s;return n;}
var X0=112, X1=1160, Y0=773, Y1=1679;
function sx(y){return X0 + (y-Y0)/(Y1-Y0)*(X1-X0);}

(function draw(){
  var svg=document.getElementById("chart");
  var lane={liu:124,su:236,lu:348,fan:460,zhang:572};

  /* 年轴网格：等距，100 年一格；端点单列 */
  var ticks=[773,900,1000,1100,1200,1300,1400,1500,1600,1679];
  ticks.forEach(function(y){
    var x=sx(y);
    E("line",{x1:x,x2:x,y1:86,y2:616,"class":"grid"},svg);
    E("line",{x1:x,x2:x,y1:610,y2:617,stroke:"#c5beaa"},svg);
    T(svg,x,638,String(y),"ax","middle");
  });
  T(svg,112,676,"年（等距刻）","ax");

  /* 生命线：出生到卒，色带 + 端点 */
  ORDER.forEach(function(k){
    var a=AUTH[k], y=lane[k], x1=sx(a.birth), x2=sx(a.death);
    E("rect",{x:x1,y:y-5,width:Math.max(2,x2-x1),height:10,fill:a.c,"fill-opacity":0.16,rx:5},svg);
    E("line",{x1:x1,x2:x2,y1:y,y2:y,stroke:a.c,"stroke-width":2,"stroke-opacity":0.75},svg);
    E("circle",{cx:x1,cy:y,r:4.2,fill:"#fbf9f2",stroke:a.c,"stroke-width":2},svg);
    E("circle",{cx:x2,cy:y,r:4.2,fill:a.c,stroke:"#fbf9f2","stroke-width":1.2},svg);
    T(svg,98,y+5,a.name,"who","end");
    T(svg,98,y+20,a.birth+"–"+a.death,"ax","end");
  });

  /* 数据点：同年同人错开；形状区分 kind */
  var slot={};
  DATA.forEach(function(d){
    var key=d[1]+"|"+d[2];
    var n=slot[key]=(slot[key]||0)+1;
    var dy=((n-1)%5-2)*8;
    var cx=sx(d[2]), cy=lane[d[1]]+dy;
    var c=AUTH[d[1]].c;
    var node;
    if(d[0]==="life"){
      node=E("path",{d:"M"+cx+" "+(cy-5.5)+" L"+(cx+5.5)+" "+cy+" L"+cx+" "+(cy+5.5)+" L"+(cx-5.5)+" "+cy+" Z",
        fill:"#fbf9f2",stroke:c,"stroke-width":1.8},svg);
    }else if(d[0]==="work"){
      node=E("circle",{cx:cx,cy:cy,r:5.2,fill:c,stroke:"#fbf9f2","stroke-width":1.3},svg);
    }else{
      node=E("rect",{x:cx-5.2,y:cy-5.2,width:10.4,height:10.4,fill:c,stroke:"#fbf9f2","stroke-width":1.3},svg);
    }
    var kind={life:"生平",work:"作品",book:"书籍"}[d[0]];
    var tt=E("title",{},node);
    tt.textContent=AUTH[d[1]].name+" · "+d[2]+" · "+kind+"\n"+d[3];
    node.style.cursor="pointer";
    node.addEventListener("click",function(){
      var box=document.getElementById("info");
      box.innerHTML="<b>"+AUTH[d[1]].name+" · "+d[2]+" · "+kind+"</b><br>"+d[3];
    });
  });

  /* 结论性注记：数字照抄任务书，不改。 */
  var ann=[
    [196,102,"永州九记约 805–815"],
    [486,214,"四篇以 1080–1084 黄州期为主（游金山寺 1071）"],
    [632,326,"入蜀记 1170"],
    [616,438,"吴船录 1177"],
    [884,550,"金山夜戏 1629 / 金山竞渡 1642"]
  ];
  ann.forEach(function(r){T(svg,r[0],r[1],r[2],"note");});

  /* 轴外注记：张岱 write 年 null，不硬塞年份 */
  E("line",{x1:sx(1644),x2:sx(1644),y1:588,y2:604,stroke:"#b05a5a","stroke-width":1,"stroke-dasharray":"3 3"},svg);
  T(svg,1158,603,"※ 張岱二篇 write 年為 null（明亡後追憶），不入年軸。","note","end");
})();
</script>
</body>
</html>
